
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JURASSIA - Archaeopteryx</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: white;
  font-family: sans-serif;
  overflow: hidden;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: white;
}

#loading {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  transition: opacity .5s ease;
}

#loading.hide {
  opacity: 0;
  pointer-events: none;
}

.dino {
  width: 65px;
  height: 55px;
  animation: walkRight 2.8s ease-in-out infinite;
}

.body {
  transform-origin: center;
  animation: bounce .35s infinite alternate;
}

.leg {
  transform-box: fill-box;
  transform-origin: top center;
  animation: step .25s infinite alternate;
}

.leg.back {
  animation-delay: .25s;
}

@keyframes walkRight {
  0% { transform: translateX(-24px); }
  100% { transform: translateX(24px); }
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-2px); }
}

@keyframes step {
  from { transform: rotate(-22deg); }
  to { transform: rotate(22deg); }
}

.loading-text {
  margin-top: 12px;
  color: #888;
  font-size: 11px;
}
</style>
</head>

<body>

<div id="loading">
  <svg class="dino" viewBox="0 0 100 75">
    <g class="body">
      <!-- Tail -->
      <path d="M30 43 Q12 34 3 43 Q15 48 31 49"
        fill="#91bd78"/>

      <!-- Body -->
      <ellipse cx="48" cy="46" rx="25" ry="15"
        fill="#91bd78"/>

      <!-- Neck and head -->
      <path d="M61 43 Q65 24 72 20"
        fill="none" stroke="#91bd78"
        stroke-width="11" stroke-linecap="round"/>

      <circle cx="76" cy="17" r="10" fill="#91bd78"/>

      <!-- Eye -->
      <circle cx="80" cy="15" r="1.8" fill="#333"/>

      <!-- Smile -->
      <path d="M78 22 Q83 25 86 21"
        fill="none" stroke="#456b42"
        stroke-width="1.3" stroke-linecap="round"/>

      <!-- Little spikes -->
      <path d="M40 32 L44 25 L48 33
               L54 25 L58 34"
        fill="#e5ad69"/>
    </g>

    <!-- Legs -->
    <g fill="none" stroke="#709c5d"
       stroke-width="5" stroke-linecap="round">
      <path class="leg" d="M38 54 L35 67"/>
      <path class="leg back" d="M57 54 L60 67"/>
    </g>

    <path d="M29 68 L36 68 M55 68 L63 68"
      stroke="#709c5d" stroke-width="3"
      stroke-linecap="round"/>
  </svg>

  <div class="loading-text">
    Menyiapkan petualangan JURASSIA...
  </div>
</div>

<model-viewer
  src="./archaeopteryx.glb"
  alt="Model 3D Archaeopteryx"
  camera-controls
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="18deg"
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
  loading="eager"
  ar
  ar-modes="scene-viewer webxr"
  ar-scale="auto">
</model-viewer>

<script>
const viewer = document.querySelector("model-viewer");
const loading = document.getElementById("loading");

viewer.addEventListener("load", () => {
  loading.classList.add("hide");
  setTimeout(() => loading.remove(), 600);
});

viewer.addEventListener("error", () => {
  loading.innerHTML = `
    <p style="color:#c44; font-size:14px;">
      Gagal memuat model 3D :(
    </p>
    <p style="color:#888; font-size:11px;">
      Periksa file archaeopteryx.glb
    </p>
  `;
});
</script>
</body>
</html>
