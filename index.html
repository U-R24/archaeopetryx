<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JURASSIA - Archaeopteryx</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

model-viewer {
  width: 100%;
  height: 100%;
  display: block;
  background: #fff;
}

#loading {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fff;
  transition: opacity .45s ease;
}

#loading.hide {
  opacity: 0;
  pointer-events: none;
}

.dino {
  width: 190px;
  max-width: 52vw;
  height: auto;
  display: block;
  transform-origin: 50% 85%;
  animation: idleWalk .48s ease-in-out infinite alternate;
  user-select: none;
  -webkit-user-drag: none;
}

.loading-text {
  margin-top: 8px;
  color: #999;
  font-size: 12px;
  letter-spacing: .2px;
  text-align: center;
}

@keyframes idleWalk {
  0%   { transform: translateY(0) rotate(-1.2deg) scale(1); }
  50%  { transform: translateY(-5px) rotate(0deg) scale(1.015); }
  100% { transform: translateY(0) rotate(1.2deg) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .dino { animation: none; }
}
</style>
</head>

<body>
<div id="loading">
  <img class="dino" src="./dino-loading.png"
       alt="Maskot T-Rex JURASSIA">
  <div class="loading-text" id="loadingText">
    Menyiapkan petualangan JURASSIA...
  </div>
</div>

<model-viewer
  src="./archaeopteryx.glb"
  alt="Model 3D Archaeopteryx"
  camera-controls
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="18deg"
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral"
  loading="eager"
  ar
  ar-modes="scene-viewer webxr"
  ar-scale="auto">
</model-viewer>

<script>
const viewer = document.querySelector("model-viewer");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

viewer.addEventListener("load", () => {
  loading.classList.add("hide");
  setTimeout(() => loading.remove(), 500);
});

viewer.addEventListener("error", () => {
  loadingText.textContent = "Model belum berhasil dimuat :(";
});
</script>
</body>
</html>
